openapi: 3.1.0
info:
  title: 食堂窗口叫号 API
  version: 0.1.0
  description: HTTP 合同权威。错误码与 DTO 只在此文件与 SPEC 出现一次。
servers:
  - url: /api/v1
paths:
  /auth/login:
    post:
      summary: 学号密码登录
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              student_id: "20260001"
              password: "diner123"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: 学号或密码错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/logout:
    post:
      summary: 退出登录并使当前令牌失效
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 已退出
        "401":
          description: 未登录
  /me:
    get:
      summary: 当前会话用户
      operationId: me
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前用户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: 未登录
  /admin/ping:
    get:
      summary: 管理员探测（用于角色隔离验收）
      operationId: adminPing
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 管理员可访问
        "403":
          description: 非管理员
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /canteens:
    get:
      summary: 食堂列表（后续 T04）
      security:
        - bearerAuth: []
      responses:
        "401":
          description: 未登录
        "501":
          description: 尚未实现
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Envelope:
      type: object
      required: [ok, data, error]
      properties:
        ok:
          type: boolean
        data: {}
        error:
          oneOf:
            - $ref: "#/components/schemas/APIError"
            - type: "null"
    APIError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - UNAUTHENTICATED
            - FORBIDDEN
            - VALIDATION_ERROR
            - WINDOW_NOT_OPEN
            - WINDOW_PAUSE_TAKE
            - HAS_ACTIVE_TICKET
            - TICKET_NOT_WAITING
            - TICKET_NOT_CALLED
            - NO_WAITING
            - CALLED_PENDING
            - NOT_FOUND
            - CONFLICT
            - DISPLAY_TOKEN_INVALID
            - INTERNAL_ERROR
        message:
          type: string
    ErrorEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
    LoginRequest:
      type: object
      required: [student_id, password]
      properties:
        student_id:
          type: string
        password:
          type: string
    PublicUser:
      type: object
      required: [id, student_id, role]
      properties:
        id:
          type: string
        student_id:
          type: string
        role:
          type: string
          enum: [diner, staff, admin]
    LoginResponse:
      type: object
      properties:
        ok:
          type: boolean
        data:
          type: object
          required: [token, user]
          properties:
            token:
              type: string
            user:
              $ref: "#/components/schemas/PublicUser"
        error:
          type: "null"
    MeResponse:
      type: object
      properties:
        ok:
          type: boolean
        data:
          $ref: "#/components/schemas/PublicUser"
        error:
          type: "null"
